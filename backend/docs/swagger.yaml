openapi: 3.0.3
info:
  title: Wishlist API
  description: >
    API for managing wishlists and their items, claiming items (1-to-1 claim
    system), expressing split interest in an item among multiple people,
    scraping Open Graph metadata for embedded links, threaded polymorphic
    comments, and public guest access to shared wishlists.
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: wishlists
    description: Wishlist management (requires owner authentication)
  - name: items
    description: Wishlist item management, claims, and split interest
  - name: embed
    description: Open Graph link embedding
  - name: shared
    description: Public shared wishlist access
  - name: comments
    description: Polymorphic, threaded comments on wishlists and items

security:
  - bearerAuth: []

paths:
  /wishlists:
    post:
      tags: [wishlists]
      summary: Create a new wishlist
      description: >
        Creates a new wishlist owned by the authenticated user. The database
        automatically generates and assigns a permanent `share_token` (UUID).
      operationId: createWishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWishlistRequest"
      responses:
        "201":
          description: Wishlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wishlists/me:
    get:
      tags: [wishlists]
      summary: List my wishlists
      description: Retrieves all wishlists belonging to the logged-in user.
      operationId: listMyWishlists
      responses:
        "200":
          description: List of the authenticated user's wishlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wishlists/{wishlistId}:
    get:
      tags: [wishlists]
      summary: Get a wishlist by id
      description: >
        Retrieves a specific wishlist owned by the authenticated user,
        including all child items, 1-to-1 claims, and split interests.
      operationId: getWishlist
      parameters:
        - $ref: "#/components/parameters/WishlistId"
      responses:
        "200":
          description: The wishlist with its items, claims, and split interests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [wishlists]
      summary: Update a wishlist
      description: Updates the wishlist title or description.
      operationId: updateWishlist
      parameters:
        - $ref: "#/components/parameters/WishlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWishlistRequest"
      responses:
        "200":
          description: Wishlist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [wishlists]
      summary: Delete a wishlist
      description: >
        Deletes the wishlist and cascades to remove all nested items, claims,
        split interests, and comments.
      operationId: deleteWishlist
      parameters:
        - $ref: "#/components/parameters/WishlistId"
      responses:
        "204":
          description: Wishlist deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/items:
    post:
      tags: [items]
      summary: Add an item to a wishlist
      description: Adds a new item to a wishlist owned by the authenticated user.
      operationId: createItem
      parameters:
        - $ref: "#/components/parameters/WishlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/comments:
    get:
      tags: [comments]
      summary: List comments on a wishlist
      description: >
        Retrieves all nested (threaded) comments associated with a specific
        wishlist, omitting item-specific comments.
      operationId: listWishlistComments
      parameters:
        - $ref: "#/components/parameters/WishlistId"
      responses:
        "200":
          description: Threaded comments for the wishlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}:
    put:
      tags: [items]
      summary: Update an item
      description: Updates item details (e.g., price changes, name updates).
      operationId: updateItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [items]
      summary: Delete an item
      description: Deletes a specific item.
      operationId: deleteItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Item deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/comments:
    get:
      tags: [comments]
      summary: List comments on an item
      description: Retrieves all nested (threaded) comments associated with a specific item.
      operationId: listItemComments
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Threaded comments for the item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/claim:
    post:
      tags: [items]
      summary: Claim an item
      description: >
        Executes a strict 1-to-1 claim for the authenticated user. Fails with
        409 Conflict if the item is already claimed by someone else.
      operationId: claimItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Item successfully claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Item is already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [items]
      summary: Unclaim an item
      description: >
        Unclaims the item. The backend verifies the requester is the same
        user who made the claim.
      operationId: unclaimItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Claim removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/split-interest:
    post:
      tags: [items]
      summary: Register split interest in an item
      description: >
        Adds the authenticated user's handle to the "interested to split"
        pool for an item. Fails if this user has already expressed interest
        on this item. No fractional amounts are tracked.
      operationId: registerSplitInterest
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitInterestRequest"
      responses:
        "201":
          description: Split interest registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitInterestEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This user has already expressed interest on this item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [items]
      summary: Remove split interest in an item
      description: Removes the authenticated user's handle from the split pool.
      operationId: removeSplitInterest
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Split interest removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /embed:
    post:
      tags: [embed]
      summary: Scrape Open Graph metadata for a URL
      description: >
        Accepts a raw URL, triggers a Go goroutine to scrape the target
        site's Open Graph tags, and returns formatted data for embedding.
      operationId: createEmbed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Scraped Open Graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          description: Invalid embed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comments:
    post:
      tags: [comments]
      summary: Create a comment
      description: >
        Creates a comment. Must include either a `wishlistId` or an `itemId`
        (exactly one). Can optionally include a `parentId` to thread the
        comment as a reply.
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Request must include exactly one of wishlistId or itemId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /shared/{shareToken}:
    get:
      tags: [shared]
      summary: Get a shared wishlist by its share token
      description: >
        Public-facing endpoint for guests to view the wishlist, its items,
        claim statuses, and split interests. No authentication required.
      operationId: getSharedWishlist
      security: []
      parameters:
        - name: shareToken
          in: path
          required: true
          description: Opaque token identifying the shared wishlist
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The shared wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedWishlist"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token

  parameters:
    WishlistId:
      name: wishlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated user does not own this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CreateWishlistRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    UpdateWishlistRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    Wishlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        share_token:
          type: string
          format: uuid
          description: Permanent UUID token used to access the wishlist via /shared/{shareToken}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WishlistDetail:
      allOf:
        - $ref: "#/components/schemas/Wishlist"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Item"

    CreateItemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        product_url:
          type: string
          format: uri
        price:
          type: number
          format: double
        embed_data:
          type: object
          description: Open Graph metadata previously fetched via POST /embed
          additionalProperties: true

    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
        product_url:
          type: string
          format: uri
        price:
          type: number
          format: double
        embed_data:
          type: object
          additionalProperties: true

    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        wishlist_id:
          type: string
          format: uuid
        name:
          type: string
        product_url:
          type: string
          format: uri
        price:
          type: number
          format: double
        embed_data:
          type: object
          additionalProperties: true
        claim:
          nullable: true
          $ref: "#/components/schemas/Claim"
        split_interests:
          type: array
          items:
            $ref: "#/components/schemas/SplitInterestEntry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClaimRequest:
      type: object
      properties:
        message:
          type: string
          description: Optional message to the wishlist owner
          example: "I'll grab this one!"

    Claim:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        message:
          type: string
        claimed_at:
          type: string
          format: date-time

    SplitInterestRequest:
      type: object
      required: [social_handle]
      properties:
        social_handle:
          type: string
          description: Plain-text social handle of the interested user
          example: "@john_smith"

    SplitInterestEntry:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        social_handle:
          type: string
          example: "@john_smith"
        created_at:
          type: string
          format: date-time

    EmbedRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: "https://example.com/product/123"

    EmbedResponse:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri

    CreateCommentRequest:
      type: object
      required: [content]
      description: Must include exactly one of wishlistId or itemId.
      properties:
        wishlistId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Optional parent comment id to thread this comment as a reply
        content:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        wishlist_id:
          nullable: true
          type: string
          format: uuid
        item_id:
          nullable: true
          type: string
          format: uuid
        parent_id:
          nullable: true
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
        replies:
          type: array
          description: Nested threaded replies to this comment
          items:
            $ref: "#/components/schemas/Comment"

    SharedWishlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        share_token:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        split_interests:
          type: array
          description: All split interests across the wishlist's items
          items:
            $ref: "#/components/schemas/SplitInterestEntry"

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
